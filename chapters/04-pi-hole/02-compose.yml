services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8053:80/tcp"          # web UI on 8053 so it doesn't fight other apps
    environment:
      TZ: "Pacific/Honolulu"   # change to yours
      FTLCONF_webserver_api_password: "pick-a-real-password"
      FTLCONF_dns_listeningMode: "all"
    volumes:
      - /srv/lab/data/pihole:/etc/pihole
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
