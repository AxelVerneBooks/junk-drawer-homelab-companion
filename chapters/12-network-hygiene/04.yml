theme: dark
jwt_secret: "use-a-long-random-string-here"
default_redirection_url: "http://localhost:9091"

server:
  listen: "0.0.0.0:9091"
  disable_healthcheck: false

authentication_backend:
  file:
    path: /config/users_database.yml

session:
  redis:
    host: authelia-redis
    port: 6379
  secret: "use-a-long-random-string-here"

regulation:
  max_retries: 5
  find_time: 10m
  ban_time: 30m

storage:
  encryption_key: "use-a-long-random-string-here"
  local:
    path: /config/db.sqlite3

notifier:
  disable_startup_check: true
  file_path: /config/notification.txt
