services:
  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    ports:
      - "9091:9091"
    environment:
      AUTHELIA_JWT_SECRET: "use-a-long-random-string-here"
      TZ: "Pacific/Honolulu"
    volumes:
      - /srv/lab/data/authelia:/config
      - /srv/lab/data/authelia/users_database.yml:/config/users_database.yml
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: authelia-redis
    volumes:
      - /srv/lab/data/authelia/redis:/data
    restart: unless-stopped
