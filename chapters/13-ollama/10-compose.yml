services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"  # Linux: http://172.17.0.1:11434
      TZ: "Pacific/Honolulu"
    volumes:
      - /srv/lab/data/open-webui:/app/backend/data
    restart: unless-stopped
