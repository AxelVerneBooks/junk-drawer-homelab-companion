[Unit]
Description=Lab backup (USB, remote, cloud)
After=network-online.target
Wants=network-online.target

[Service]
Type=oneshot
User=youruser
ExecStartPre=/bin/sleep 10
# USB backup
ExecStart=/bin/bash -c '
  set -e
  mount /dev/sdb1 /mnt/backup-usb || true
  cp /srv/lab/data/**/db* /srv/lab/backup/ 2>/dev/null || true
  restic -r /mnt/backup-usb backup /srv/lab/data /srv/lab/backup
  umount /mnt/backup-usb || true
'

[Install]
WantedBy=multi-user.target
